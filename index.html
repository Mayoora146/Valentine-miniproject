<!DOCTYPE html>
<html>
<head>
    <title>Valentine Mood Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Will you be my Valentine? ❤️</h2>

        <div id="emojiDisplay">💌</div>

        <p id="responseText">Choose your reaction...</p>

        <div class="buttons">
            <button onclick="setMood('happy')">😊</button>
            <button onclick="setMood('sad')">😢</button>
            <button onclick="setMood('angry')">😡</button>
            <button onclick="setMood('surprised')">😲</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
